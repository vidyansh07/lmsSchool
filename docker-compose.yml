# ===========================================================================
# Local development stack.
#
#   docker compose up --build
#
# Services: PostgreSQL, Django, Next.js. Redis is defined behind the `redis`
# profile so it can be switched on (and Celery added alongside it) without
# restructuring this file:
#
#   docker compose --profile redis up
#
# Every value comes from .env (copy .env.example first). No credential is
# hard-coded here.
# ===========================================================================

name: grras-lms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grras_lms}
      POSTGRES_USER: ${POSTGRES_USER:-grras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Scrypt password hashing for the database role itself.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on localhost only so the database is never reachable from the
      # local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grras} -d ${POSTGRES_DB:-grras_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    restart: unless-stopped
    command: ["runserver"]
    env_file:
      - .env
    environment:
      DJANGO_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-grras}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grras_lms}
      # Emailed links point at the frontend, which the browser reaches on the
      # host, not at the backend service name.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      RUN_MIGRATIONS: "true"
    volumes:
      # Bind mount for hot reload; the virtualenv lives outside /app so it is
      # not shadowed by the mount.
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep container-installed dependencies and build cache off the host.
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: the Node server binds IPv4 only, while
      # `localhost` resolves to ::1 first inside the container.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Not started by default. Enable with: docker compose --profile redis up
  # Set CACHE_URL=redis://redis:6379/0 in .env to make the backend use it.
  # A Celery worker/beat service belongs here too, sharing this broker.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next_cache:
