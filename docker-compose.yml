# ===========================================================================
# Local development stack.
#
#   docker compose up --build
#
# Services: PostgreSQL, Django, Next.js. Redis, the Celery worker and beat sit
# behind the `redis` profile, because a laptop does not need a broker to run the
# app — without one, tasks run inline:
#
#   docker compose --profile redis up
#
# Every value comes from .env (copy .env.example first). No credential is
# hard-coded here.
# ===========================================================================

name: grras-lms

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-grras_lms}
      POSTGRES_USER: ${POSTGRES_USER:-grras}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Scrypt password hashing for the database role itself.
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Exposed on localhost only so the database is never reachable from the
      # local network.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-grras} -d ${POSTGRES_DB:-grras_lms}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    restart: unless-stopped
    command: ["runserver"]
    env_file:
      - .env
    environment:
      DJANGO_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-grras}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grras_lms}
      # Emailed links point at the frontend, which the browser reaches on the
      # host, not at the backend service name.
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      # Same expression as the worker's, so the two cannot end up on different
      # Redis databases and silently drop every task.
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: "true"
    volumes:
      # Bind mount for hot reload; the virtualenv lives outside /app so it is
      # not shadowed by the mount.
      - ./backend:/app
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/live/"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: development
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
      NEXT_PUBLIC_APP_ENV: ${NEXT_PUBLIC_APP_ENV:-local}
      INTERNAL_API_BASE_URL: ${INTERNAL_API_BASE_URL:-http://backend:8000}
      WATCHPACK_POLLING: "true"
    volumes:
      - ./frontend:/app
      # Keep container-installed dependencies and build cache off the host.
      - frontend_node_modules:/app/node_modules
      - frontend_next_cache:/app/.next
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      # 127.0.0.1, not localhost: the Node server binds IPv4 only, while
      # `localhost` resolves to ::1 first inside the container.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # Not started by default. Enable with: docker compose --profile redis up
  # Set CACHE_URL=redis://redis:6379/0 in .env to make the backend use it.
  redis:
    image: redis:7-alpine
    profiles: ["redis"]
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # The worker. Same image and code as the backend, different entry point: a
  # task must behave identically whether it ran inline in a test or on a worker,
  # and two images would eventually drift.
  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    profiles: ["redis"]
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --queues=grras
      # No task should outlive its soft limit; this is the belt to that brace.
      - --max-tasks-per-child=200
    env_file:
      - .env
    environment:
      DJANGO_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-grras}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grras_lms}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:3000}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      # The worker must never run migrations: two processes racing to migrate
      # the same database is how a deployment corrupts its own schema.
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      # No --destination: the shell that runs a healthcheck does not always
      # have HOSTNAME set, and naming a worker that does not answer reports a
      # perfectly healthy process as unhealthy — which in a deployment means
      # restarting it on a loop. Pinging the queue answers the real question.
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "10"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # The scheduler. Exactly one replica, ever: two beats mean every periodic task
  # fires twice, which for the outbox sweep means every retry sent twice.
  beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: development
    profiles: ["redis"]
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env
    environment:
      DJANGO_ENV: local
      DJANGO_SETTINGS_MODULE: config.settings.local
      DATABASE_URL: postgres://${POSTGRES_USER:-grras}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-grras_lms}
      CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
      RUN_MIGRATIONS: "false"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
  frontend_next_cache:
