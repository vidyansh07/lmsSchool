# Gitleaks configuration.
#
# Starts from the maintained default rule set and adds allowlists only for
# values that are provably not secrets: template files, obviously fake demo
# data, and the development placeholder key that deployed environments refuse
# to boot with.

title = "Grras LMS secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Documented non-secrets"
paths = [
  '''\.env\.example$''',
  '''\.env\..*\.example$''',
  '''package-lock\.json$''',
  # Build output and installed dependencies. Never committed (see .gitignore);
  # excluded so a local filesystem scan matches what CI scans in git history.
  '''(^|/)\.next/''',
  '''(^|/)node_modules/''',
  '''(^|/)\.venv/''',
  '''(^|/)staticfiles/''',
  '''(^|/)htmlcov/''',
  '''(^|/)playwright-report/''',
  # Real per-environment secret files. They are git-ignored (see .gitignore), so
  # CI — which scans git history — never sees them; this line only stops a local
  # filesystem scan reporting a file that cannot be committed. The claim that
  # they are ignored is not taken on trust: `make scan` checks it separately,
  # so removing the .gitignore entry fails the gate rather than silently
  # widening it.
  # Matches `.env` and `.env.staging`, but not `.env.staging.example`: the
  # character class excludes a dot, so a name with a further suffix cannot
  # reach the end anchor. (Go's regexp has no lookahead to say it directly.)
  '''(^|/)\.env(\.[A-Za-z0-9_-]+)?$''',
  # Backups taken by scripts/backup.sh. Ignored, and full of real data by design.
  '''(^|/)backups/''',
  # Keys and certificates. Genuinely secret, genuinely git-ignored (*.pem in
  # .gitignore), and therefore never in the history CI scans. Listed for the
  # same reason as the env files: so a local filesystem scan does not report a
  # file that cannot be committed. `make secrets` proves the ignore holds.
  '''\.(pem|key|p12|pfx)$''',
]
regexes = [
  # Development placeholder; any deployed environment refuses to start with it.
  '''insecure-development-key[a-z0-9-]*''',
  # Reserved, undeliverable domain used by the demo seed (RFC 2606).
  '''[a-z0-9._-]+@demo\.grras\.invalid''',
  # Fake DSNs used in tests and documentation.
  '''postgres://user:pass@db\.example\.com''',
  '''postgres://grras:CHANGE_ME@''',
]
