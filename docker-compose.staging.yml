# ===========================================================================
# Staging stack — production-shaped.
#
#   docker compose -f docker-compose.staging.yml --env-file .env.staging up -d
#
# Differences from local development, all deliberate:
#   * production image targets (gunicorn, Next.js standalone build)
#   * DEBUG=False and the full hardened security configuration
#   * its own database volume, its own secrets file, its own Redis
#   * https, terminated by Caddy — hardened settings mark the session cookie
#     Secure, so a browser on plain http never stores it
#   * a Celery worker and scheduler, as a deployment has
#   * object storage over the S3 protocol (MinIO here, AWS in a real staging)
#   * seeded exclusively with fake demo data (`docker compose run backend seed`)
#
# It must never be pointed at a production database or given production
# secrets. See docs/environments.md.
# ===========================================================================

name: grras-lms-staging

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set in .env.staging}
      POSTGRES_USER: ${POSTGRES_USER:?set in .env.staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in .env.staging}
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256"
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - staging_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # TLS in front of everything, on one origin. See infra/proxy/Caddyfile.
  proxy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    volumes:
      - ./infra/proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - staging_caddy_data:/data
      - staging_caddy_config:/config
    environment:
      # See infra/proxy/Caddyfile: the one address this stack answers on.
      SITE_ADDRESS: ${SITE_ADDRESS:-https://localhost:8443}
    ports:
      # Loopback on a laptop; PROXY_BIND=0.0.0.0 on a server that should be
      # reachable from outside. Nothing else in the stack is ever published.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8443}:8443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy

  # S3-compatible object storage. §15.4 asks for external S3; no bucket is
  # provisioned for this project, and MinIO speaks the same protocol to the same
  # boto3 client — private objects, signed URLs, the lot. Moving to AWS is a
  # change of AWS_S3_ENDPOINT_URL and nothing else, which is the point of having
  # the storage backend behind a seam.
  storage:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AWS_ACCESS_KEY_ID:?set in .env.staging}
      MINIO_ROOT_PASSWORD: ${AWS_SECRET_ACCESS_KEY:?set in .env.staging}
    volumes:
      - staging_object_storage:/data
    ports:
      - "127.0.0.1:${STORAGE_PORT:-9000}:9000"
      - "127.0.0.1:${STORAGE_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  # Creates the bucket once and exits. The bucket is left private: no anonymous
  # policy is set, which is the whole point of §14.3.
  storage-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      storage:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:?set in .env.staging}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:?set in .env.staging}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:?set in .env.staging}
    entrypoint:
      - /bin/sh
      - -c
      - |
        mc alias set staging http://storage:9000 "$$AWS_ACCESS_KEY_ID" "$$AWS_SECRET_ACCESS_KEY"
        mc mb --ignore-existing "staging/$$AWS_STORAGE_BUCKET_NAME"
        mc anonymous set none "staging/$$AWS_STORAGE_BUCKET_NAME"
        echo "bucket $$AWS_STORAGE_BUCKET_NAME ready and private"

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: production
    restart: unless-stopped
    command: ["gunicorn"]
    env_file:
      - .env.staging
    environment:
      DJANGO_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      RUN_MIGRATIONS: "true"
      COLLECT_STATIC: "true"
    volumes:
      # Separate storage from every other environment.
      - staging_media:/app/mediafiles
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8001}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      storage-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8000/health/ready/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s

  frontend:
    build:
      context: .
      dockerfile: infra/docker/frontend.Dockerfile
      target: production
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:?set in .env.staging}
        NEXT_PUBLIC_APP_ENV: staging
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3001}:3000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # 127.0.0.1, not localhost: the Node server binds IPv4 only, while
      # `localhost` resolves to ::1 first inside the container.
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:3000/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # The worker and the scheduler, as a deployment has them. Same image as the
  # backend, different entry point: a task must behave identically whether it
  # ran inline in a test or on a worker.
  worker:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: production
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - worker
      - --loglevel=info
      - --concurrency=${CELERY_CONCURRENCY:-2}
      - --queues=grras
      - --max-tasks-per-child=200
    env_file:
      - .env.staging
    environment:
      DJANGO_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      # Never from a worker: two processes racing to migrate one database is
      # how a deployment corrupts its own schema.
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      # No --destination: the shell that runs a healthcheck does not always
      # have HOSTNAME set, and naming a worker that does not answer reports a
      # perfectly healthy process as unhealthy — which in a deployment means
      # restarting it on a loop. Pinging the queue answers the real question.
      #
      # `inspect ping` waits its full --timeout collecting replies even after
      # the first arrives, so the command costs roughly startup + --timeout.
      # 15s of waiting plus interpreter startup under a 20s limit leaves almost
      # no margin on a loaded host, and the same arrangement in
      # `docker-compose.yml` marked a worker that answered every ping unhealthy
      # 55 times running. Celery's wait now sits well inside Docker's.
      test: ["CMD", "celery", "-A", "config", "inspect", "ping", "--timeout", "10"]
      interval: 30s
      timeout: 25s
      retries: 3
      start_period: 30s

  # Exactly one replica, ever. Two schedulers mean every periodic task fires
  # twice, which for the outbox sweep means every retry sent twice.
  beat:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
      target: production
    restart: unless-stopped
    command:
      - celery
      - -A
      - config
      - beat
      - --loglevel=info
      - --schedule=/tmp/celerybeat-schedule
    env_file:
      - .env.staging
    environment:
      DJANGO_ENV: staging
      DJANGO_SETTINGS_MODULE: config.settings.staging
      RUN_MIGRATIONS: "false"
      COLLECT_STATIC: "false"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  staging_caddy_data:
  staging_caddy_config:
  staging_postgres_data:
  staging_redis_data:
  staging_object_storage:
  staging_media:
